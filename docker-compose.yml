services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: akari
      POSTGRES_PASSWORD: akari-dev
      POSTGRES_DB: akari
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akari"]
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  valkeydata:
