# nginx in front of the panel (bare metal). Drop into /etc/nginx/conf.d/.
#
# ONLY the secret prefix is forwarded; everything else on this server name
# returns an empty 404 from nginx. TLS: use certbot (webroot/standalone) or
# your own certificates. Replace the three placeholders:
#   panel.example.com   your domain
#   SECRETPREFIX        output of `akari info` (without the leading slash)
#   certificate paths
#
# panel.toml: bind = "127.0.0.1:8080", trusted_proxies = ["127.0.0.1/32"],
# cookie_secure = true. This file contains the secret prefix: chmod 640.

# Access log WITHOUT the request URI: it holds the secret prefix and
# subscription tokens (never log it).
log_format akari '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time rid=$request_id';

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    server_tokens off;
    access_log off;
    # ACME http-01 challenge, otherwise nothing is served on plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:akari:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/akari.access.log akari;
    client_max_body_size 1m;

    # The panel, behind its secret prefix only.
    location /SECRETPREFIX/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # APPEND to X-Forwarded-For: the panel takes the rightmost hop that
        # is not a trusted proxy. Never overwrite it with a client value.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Everything else (including "/"): empty 404.
    location / {
        return 404;
    }
}
