[package]
name = "akari-panel"
version = "0.4.0-rc.1"
edition = "2024"
publish = false

[[bin]]
name = "akari"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.22"
arc-swap = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
data-encoding = "2"
fred = { version = "10", features = ["enable-rustls", "i-scripts"] }
hex = "0.4"
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
idna = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
prost = "0.14"
rand = "0.9"
ring = "0.17"
rcgen = { version = "0.14", features = ["pem", "x509-parser", "ring"] }
rpassword = "7"
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# R18-2: TLS probes (install pin, REALITY dest check); same versions sqlx/fred already link.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
webpki-roots = "1"
toml = "0.9"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"
# W31: free/total space of the data directory (statvfs, no unsafe).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
# R18-2: REALITY key pairs (curve25519-dalek 4 is already linked via ed25519-dalek).
x25519-dalek = { version = "2", features = ["static_secrets"] }
prometheus = { version = "0.14", default-features = false }
mimalloc = { version = "0.1", default-features = false }
# W15: SMTP (outbox sender, test mail); rustls + ring + webpki roots like the
# rest of the binary, no native-tls/OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
# W27 passkeys: kanidm webauthn-rs (MPL-2.0, deny.toml exception). State
# serialisation = ceremony state kept server-side in Valkey (never handed
# to the client); conditional-ui = discoverable (usernameless) login.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# webauthn-rs-core verifies with OpenSSL: the only OpenSSL in the binary,
# built from source (vendored) so the static musl build stays
# self-contained; TLS stays rustls.
openssl = { version = "0.10.81", features = ["vendored"] }
# D4/D11 front door (web.rs): `service_fn` + `oneshot` (already in the
# graph through axum).
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
protox = "0.9"
# W26: proto/protocols.toml is parsed and validated at build time
# (src/protocols/manifest_def.rs, shared with the crate).
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tonic-prost-build = "0.14"

# cargo-fuzz builds the library with `--cfg fuzzing` (src/fuzzing.rs: entry
# points for fuzz/ only, absent from every other build).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# CI-only build of the static binary/image (Dockerfile CARGO_PROFILE=ci,
# ci.yml `build`): same code as `release`, without the Dockerfile's
# release-only thin LTO and single codegen unit, so it compiles much faster.
# Releases (release.yml) keep the release profile.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug = false
strip = true
