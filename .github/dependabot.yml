# Dependency version updates (rule 2026-10-22: every dependency stays on its
# latest version). Monthly (2026-10-26), grouped: one PR per ecosystem for
# minor+patch, majors in their own PR so breaking changes are reviewed alone.
# Minor/patch PRs are auto-merged into the merge queue by
# .github/workflows/dependabot-automerge.yml; majors never are.
# A 3-day cooldown skips releases younger than that (supply-chain hygiene).
# Security updates are separate (repo setting), unaffected by this schedule.
version: 2
updates:
  # Admin and portal share one PR for minor+patch.
  - package-ecosystem: npm
    directories: [/admin, /portal]
    schedule: { interval: monthly, time: "03:00", timezone: Asia/Shanghai }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(npm)" }
    # TypeScript 7 (the Go compiler) ships no compiler API: typescript-eslint
    # (admin) and svelte-check (portal) still require TypeScript < 7. Remove
    # this once they support it (user rule: deps on latest, blockers documented).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  # Root crate, bench/ and fuzz/ (separate lockfiles) move together.
  - package-ecosystem: cargo
    directories: [/, /bench, /fuzz]
    schedule: { interval: monthly, time: "03:00", timezone: Asia/Shanghai }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(rust)" }
    groups:
      cargo-minor:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, time: "03:00", timezone: Asia/Shanghai }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci" }
    groups:
      actions:
        update-types: [minor, patch, major]
