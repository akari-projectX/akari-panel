name: e2e setup
description: >-
  Browser end-to-end runner setup shared by the e2e shard and perf jobs:
  Node + npm dependencies + Chromium for the chosen apps, the dev PostgreSQL
  and Valkey (docker compose), and the panel binary built once by the
  `panel build` job (artifact `panel-release`: target/release/akari and
  portal/dist). Run after actions/checkout.

inputs:
  portal:
    description: install the portal's dependencies and its Playwright browser
    default: "false"
  admin:
    description: install the admin app's dependencies and its Playwright browser
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24" # package.json engines: >=22.18
        cache: npm
        cache-dependency-path: |
          portal/package-lock.json
          admin/package-lock.json
    # The runner's own Postgres would collide with compose's port.
    - shell: bash
      run: sudo systemctl stop postgresql || true
    # Started first so the images are pulled while npm and Chromium install.
    - shell: bash
      run: make dev-up
    # The runner's apt mirror is sometimes extremely slow (~40 KB/s: the
    # system libraries and fonts of --with-deps then exceed the install
    # timeout). Keep the downloaded .deb files and the Chromium builds between
    # runs: apt installs from the local files and downloads only what changed.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/akari-apt
          ~/.cache/ms-playwright
        key: e2e-browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('portal/package-lock.json', 'admin/package-lock.json') }}
        restore-keys: e2e-browsers-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: |
        mkdir -p ~/.cache/akari-apt
        # apt must keep what it downloads (some images clean the archive after install).
        printf 'APT::Keep-Downloaded-Packages "true";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\n' \
          | sudo tee /etc/apt/apt.conf.d/99akari-keep-debs >/dev/null
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        sudo cp -n ~/.cache/akari-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
    # System libraries and fonts for Chromium, once for both apps. The
    # runner's Azure apt mirror is sometimes extremely slow (~40 KB/s): give it
    # 4 minutes, then switch to archive.ubuntu.com and try once more.
    - shell: bash
      working-directory: ${{ inputs.portal == 'true' && 'portal' || 'admin' }}
      run: |
        npm ci
        deps() { timeout "$1" sudo env "PATH=$PATH" npx playwright install-deps chromium; }
        if ! deps 240; then
          echo "::warning::apt mirror slow or failing: retrying with archive.ubuntu.com"
          # `timeout` stops npx, not the apt-get it started: stop that too and
          # wait for the dpkg lock before the retry.
          sudo pkill -f 'apt-get|/usr/lib/apt/methods/' || true
          for _ in $(seq 1 30); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break; sleep 1; done
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo dpkg --configure -a || true
          deps 480
        fi
    # portal/ and admin/ pin their own Playwright versions; each needs its
    # browser build (downloaded from the Playwright CDN, cached above).
    # `timeout`: a stuck install fails the step instead of holding the runner.
    - if: ${{ inputs.portal == 'true' }}
      shell: bash
      run: cd portal && { [ -d node_modules ] || npm ci; } && timeout 600 npx playwright install chromium
    - if: ${{ inputs.admin == 'true' }}
      shell: bash
      run: cd admin && { [ -d node_modules ] || npm ci; } && timeout 600 npx playwright install chromium
    - shell: bash
      run: cp -n /var/cache/apt/archives/*.deb ~/.cache/akari-apt/ 2>/dev/null || true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: panel-release
        path: .
    # Artifacts do not keep the mode bits.
    - shell: bash
      run: chmod +x target/release/akari
