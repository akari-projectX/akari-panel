name: release

# Tag `vX.Y.Z` (must equal Cargo.toml's version, commit must be on main):
#   build static linux amd64/arm64 binaries and a distroless image,
#   SBOM (CycloneDX), the installer (install.sh) + deploy bundle
#   (akari-deploy.tar.gz), cosign keyless signatures (GitHub OIDC),
#   SHA256SUMS, GitHub Release, image pushed to ghcr.io/akari-projectx/akari-panel.
#   The installer verifies SHA256SUMS against this workflow's identity at the
#   tag (scripts/install.sh COSIGN_IDENTITY_PREFIX): keep the file name.
# Verification recipe: docs/DEPLOY.md ("Verify a release"); the image job
# and the release job run that recipe against what they just signed.
#
# Dry run (W14): a pull request touching the release inputs runs the whole
# pipeline without publishing: same builds, SBOM and licence file, the image
# goes to a throwaway registry on the runner (localhost:5000) instead of
# ghcr.io, and every signature is made keylessly with the PR's identity and
# verified with the same commands; no GitHub Release is created.
#
# W37 pre-release gate: on a tag push the full CI suite (ci.yml, every
# job regardless of the changed paths) and fuzz.yml run on the tagged
# commit (workflow_call) in parallel with the builds; nothing is published
# (image push, GitHub Release) unless both pass. Dry runs skip them (the
# PR's own ci/fuzz runs cover the PR).
#
# Third-party actions are pinned to commit SHAs (comment = tag).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
      - scripts/third-party.py
      - scripts/release-bundle.sh
      - Cargo.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: full CI (pre-release)
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  fuzz:
    name: fuzz (pre-release)
    if: github.event_name == 'push'
    uses: ./.github/workflows/fuzz.yml
    permissions:
      contents: read

  verify-tag:
    name: tag matches Cargo.toml and main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      epoch: ${{ steps.v.outputs.epoch }}
      # Dry run: "true" on pull requests (nothing is published).
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            dry_run=false
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::tag commit is not on main"; exit 1; }
          else
            # Dry run: the release the current Cargo.toml would produce.
            dry_run=true
            version="$cargo_version"
          fi
          echo "dry_run=$dry_run" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"

  build:
    name: build linux/${{ matrix.arch }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Native build per architecture (no emulation): the Dockerfile's
      # `artifact` stage holds only the static musl binary.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: artifact
          platforms: linux/${{ matrix.arch }}
          build-args: |
            AKARI_GIT_SHA=${{ needs.verify-tag.outputs.short_sha }}
            SOURCE_DATE_EPOCH=${{ needs.verify-tag.outputs.epoch }}
          outputs: type=local,dest=out
          provenance: false
      - name: name the binary
        run: |
          mkdir -p dist
          install -m 0755 out/akari "dist/akari-linux-${{ matrix.arch }}"
          file "dist/akari-linux-${{ matrix.arch }}"
      # Each runner is native, so the binary can be executed here.
      - name: version check
        env:
          WANT: akari ${{ needs.verify-tag.outputs.version }} (${{ needs.verify-tag.outputs.short_sha }})
        run: |
          out="$(dist/akari-linux-${{ matrix.arch }} --version)"
          echo "$out"
          [ "$out" = "$WANT" ] || { echo "::error::unexpected --version (want: $WANT)"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akari-linux-${{ matrix.arch }}
          path: dist/akari-linux-${{ matrix.arch }}
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo.lock + spa/ and admin/ package-lock.json: the complete dependency set.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: akari-panel-${{ needs.verify-tag.outputs.tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # Third-party licence notice of the binary (scripts/third-party.py):
      # linked crates + npm packages bundled into the SPA, with their texts.
      - run: rustup toolchain install --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            spa/package-lock.json
            admin/package-lock.json
      - run: cd spa && npm ci --ignore-scripts
      - run: cd admin && npm ci --ignore-scripts
      - run: |
          cargo fetch --locked
          python3 scripts/third-party.py -o THIRD_PARTY_LICENSES.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            akari-panel-${{ needs.verify-tag.outputs.tag }}.cdx.json
            THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  image:
    name: image (ghcr.io)
    # ci/fuzz are skipped on dry runs: `!failure()` instead of the implicit
    # success(), which would also skip this job (and everything after it)
    # because a skipped job is among its ancestors.
    needs: [verify-tag, build, sbom, ci, fuzz]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    outputs:
      ref: ${{ steps.name.outputs.image }}:${{ needs.verify-tag.outputs.version }}@${{ steps.push.outputs.digest }}
    env:
      DRY_RUN: ${{ needs.verify-tag.outputs.dry_run }}
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: akari-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - id: name
        run: |
          if [ "$DRY_RUN" = true ]; then
            # Throwaway registry on the runner: the dry run publishes nothing.
            docker run -d --name registry -p 5000:5000 registry:3
            echo "image=localhost:5000/akari-panel" >>"$GITHUB_OUTPUT"
            echo "cosign_flags=--allow-http-registry" >>"$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/akari-panel" >>"$GITHUB_OUTPUT"
            echo "cosign_flags=" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The dry run's registry is localhost:5000 on the runner.
          driver-opts: network=host
      - if: needs.verify-tag.outputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # value= makes the dry run (no tag ref) tag like the real release.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify-tag.outputs.tag }},enable=${{ !contains(needs.verify-tag.outputs.tag, '-') }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      # The image carries exactly the released binaries (target `prebuilt`:
      # COPY only, so the multi-arch build needs no emulation).
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify-tag.outputs.epoch }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign image and attach SBOM attestation
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          FLAGS: ${{ steps.name.outputs.cosign_flags }}
        run: |
          # shellcheck disable=SC2086 # FLAGS is empty or one flag
          cosign sign --yes $FLAGS "${IMAGE}@${DIGEST}"
          # shellcheck disable=SC2086
          cosign attest --yes $FLAGS --type cyclonedx \
            --predicate "sbom/akari-panel-${TAG}.cdx.json" "${IMAGE}@${DIGEST}"
      # docs/DEPLOY.md "Verify a release", with this run's identity (the
      # tag's workflow ref; refs/pull/N/merge on a dry run).
      - name: verify signature and SBOM attestation (DEPLOY.md recipe)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          FLAGS: ${{ steps.name.outputs.cosign_flags }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # shellcheck disable=SC2086
          cosign verify $FLAGS "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          # shellcheck disable=SC2086
          cosign verify-attestation $FLAGS --type cyclonedx "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          echo "verified: ${IMAGE}:${TAG#v}@${DIGEST}"

  release:
    name: GitHub Release
    needs: [verify-tag, build, sbom, image, ci, fuzz]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless
    env:
      DRY_RUN: ${{ needs.verify-tag.outputs.dry_run }}
      TAG: ${{ needs.verify-tag.outputs.tag }}
      # ghcr.io/akari-projectx/akari-panel:X.Y.Z@sha256:… (what compose pins)
      IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          fetch-depth: 1
      # The panel installer (scripts/install.sh, stamped with this tag: the
      # one-line `releases/latest/download/install.sh | sh`) and the deploy
      # bundle it installs (compose file, Caddyfile, units, backup scripts).
      - name: installer and deploy bundle
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify-tag.outputs.epoch }}
        run: src/scripts/release-bundle.sh "$TAG" release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: akari-linux-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: checksums and signatures
        working-directory: release
        run: |
          chmod 0755 akari-linux-*
          # The image reference with its digest, signed with the rest: what
          # deploy/.env's AKARI_IMAGE is set to.
          printf '%s\n' "$IMAGE_REF" > akari-panel-image.txt
          files="akari-linux-amd64 akari-linux-arm64 akari-panel-${TAG}.cdx.json THIRD_PARTY_LICENSES.txt akari-panel-image.txt install.sh akari-deploy.tar.gz"
          # shellcheck disable=SC2086
          sha256sum $files > SHA256SUMS
          # Keyless: the certificate binds the signature to this workflow
          # run (identity = this workflow at this tag, issuer = GitHub OIDC).
          for f in $files SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      # docs/DEPLOY.md "Verify a release", with this run's identity.
      - name: verify (DEPLOY.md recipe)
        working-directory: release
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          for f in akari-linux-amd64 akari-linux-arm64 akari-panel-image.txt install.sh akari-deploy.tar.gz SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum -c SHA256SUMS
      - name: publish
        if: needs.verify-tag.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          notes="$(printf 'Install (Debian 12/13, Ubuntu 22.04/24.04; docs/DEPLOY.md):\n\n```\ncurl -fsSL https://github.com/%s/releases/download/%s/install.sh | sh\n```\n\nUpgrade an installation: `akari-ctl upgrade --version %s`.\n\nImage (deploy/.env `AKARI_IMAGE`):\n\n```\n%s\n```\n\nVerify before use: docs/DEPLOY.md "Verify a release".\n' "$GITHUB_REPOSITORY" "$TAG" "$TAG" "$IMAGE_REF")"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease \
            --title "$TAG" --notes "$notes"
