name: release

# Tag `vX.Y.Z` (must equal Cargo.toml's version, commit must be on main):
#   build static linux amd64/arm64 binaries and a distroless image,
#   SBOM (CycloneDX), cosign keyless signatures (GitHub OIDC), SHA256SUMS,
#   GitHub Release, image pushed to ghcr.io/akari-projectx/akari-panel.
# Verification recipe: docs/DEPLOY.md ("Verify a release").
#
# Third-party actions are pinned to commit SHAs (comment = tag).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: tag matches Cargo.toml and main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag commit is not on main"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"

  build:
    name: build linux/${{ matrix.arch }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Native build per architecture (no emulation): the Dockerfile's
      # `artifact` stage holds only the static musl binary.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: artifact
          platforms: linux/${{ matrix.arch }}
          build-args: |
            AKARI_GIT_SHA=${{ needs.verify-tag.outputs.short_sha }}
            SOURCE_DATE_EPOCH=${{ needs.verify-tag.outputs.epoch }}
          outputs: type=local,dest=out
          provenance: false
      - name: name the binary
        run: |
          mkdir -p dist
          install -m 0755 out/akari "dist/akari-linux-${{ matrix.arch }}"
          file "dist/akari-linux-${{ matrix.arch }}"
      # Each runner is native, so the binary can be executed here.
      - name: version check
        env:
          WANT: akari ${{ needs.verify-tag.outputs.version }} (${{ needs.verify-tag.outputs.short_sha }})
        run: |
          out="$(dist/akari-linux-${{ matrix.arch }} --version)"
          echo "$out"
          [ "$out" = "$WANT" ] || { echo "::error::unexpected --version (want: $WANT)"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: akari-linux-${{ matrix.arch }}
          path: dist/akari-linux-${{ matrix.arch }}
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo.lock + spa/package-lock.json: the complete dependency set.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: akari-panel-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: akari-panel-${{ github.ref_name }}.cdx.json
          if-no-files-found: error

  image:
    name: image (ghcr.io)
    needs: [verify-tag, build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: akari-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/akari-panel" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      # The image carries exactly the released binaries (target `prebuilt`:
      # COPY only, so the multi-arch build needs no emulation).
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify-tag.outputs.epoch }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign image and attach SBOM attestation
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx \
            --predicate "sbom/akari-panel-${GITHUB_REF_NAME}.cdx.json" "${IMAGE}@${DIGEST}"

  release:
    name: GitHub Release
    needs: [verify-tag, build, sbom, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: akari-linux-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: checksums and signatures
        working-directory: release
        run: |
          chmod 0755 akari-linux-*
          sha256sum akari-linux-amd64 akari-linux-arm64 "akari-panel-${GITHUB_REF_NAME}.cdx.json" > SHA256SUMS
          # Keyless: the certificate binds the signature to this workflow
          # run (identity = this workflow at this tag, issuer = GitHub OIDC).
          for f in akari-linux-amd64 akari-linux-arm64 "akari-panel-${GITHUB_REF_NAME}.cdx.json" SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease \
            --title "$GITHUB_REF_NAME"
