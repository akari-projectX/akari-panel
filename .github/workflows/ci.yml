name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: advisories appear without code changes; smoke drift
  workflow_dispatch:
    inputs:
      agent_ref:
        # Panel-first merge order (CLAUDE.md): a panel PR whose feature
        # needs an unmerged agent change is verified by dispatching this
        # workflow on the panel branch with the agent branch here. Dispatch
        # runs are strict: smoke fails instead of skipping any
        # agent-dependent section (SMOKE_REQUIRE_AGENT=1).
        description: akari-agent ref for the smoke job (dispatch runs forbid smoke skips)
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same values as docker-compose.yml (the local dev stack).
  DATABASE_URL: postgres://akari:akari-dev@localhost:5432/akari
  VALKEY_URL: redis://127.0.0.1:6379

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: akari
          POSTGRES_PASSWORD: akari-dev
          POSTGRES_DB: akari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akari" --health-interval 3s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # DB tests must run, not skip: AKARI_SKIP_DB_TESTS is deliberately
      # unset, and an unreachable database makes them panic (not pass).
      - run: cargo test --locked
        env:
          AKARI_SKIP_DB_TESTS: ""

  bench-tooling:
    # The M2 benchmark/load crate (bench/, own lockfile) must keep building
    # against the panel library; running the benchmarks is bench.yml.
    name: bench tooling (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bench -> ../target
      - run: make bench-lint

  spa:
    name: spa (tsc, auth paths, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # package.json engines: >=22.18
          cache: npm
          cache-dependency-path: spa/package-lock.json
      - run: npm ci
      # A19: known-vulnerable dependencies fail the build (high and above).
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      # ESLint (typescript-eslint, react-hooks, jsx-a11y) + Prettier check.
      - run: npm run lint
      - run: node scripts/check-auth-paths.mjs
      # M3: frontend unit tests (vitest + Testing Library, jsdom).
      - run: npx vitest run
      # R23: both bundles (user portal, admin console) + the guard that the
      # user bundle carries no admin code (scripts/check-bundles.mjs).
      - run: npm run build

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # rust-version: the action's bundled cargo-deny needs no toolchain.

  docker:
    # The release Dockerfile must keep building (no push): static binary,
    # non-root distroless runtime, version stamped.
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        run: |
          sha="$(git rev-parse --short=12 HEAD)"
          docker buildx build --load -t akari-panel:ci --build-arg "AKARI_GIT_SHA=$sha" .
      - name: image properties
        run: |
          [ "$(docker image inspect akari-panel:ci --format '{{.Config.User}}')" = "65532" ]
          docker run --rm akari-panel:ci --version
          docker run --rm --entrypoint /akari akari-panel:ci config check >/dev/null
      - name: monitoring config (Prometheus rules + tests, Grafana dashboards)
        run: make monitoring-check

  e2e:
    # Browser end-to-end (Playwright, Chromium) against a real panel serving
    # the embedded SPA with its real CSP (no bypass): login with and without
    # 2FA, language switch, styled admin pages, no CSP violations.
    # Non-required while it settles (OPUS-GUIDE A17).
    name: e2e (playwright, real CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spa/package-lock.json
      # The runner's own Postgres would collide with compose's port.
      - run: sudo systemctl stop postgresql || true
      - run: cd spa && npm ci && npx playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            spa/playwright-report
            /tmp/akari-e2e/*.log
          retention-days: 7
      - if: always()
        run: docker compose down -v || true

  smoke:
    # Cross-repo end-to-end (smoke.sh). Needs the sibling layout
    # ../akari-agent, so both repos are checked out under the workspace dir.
    # Runs on PRs, pushes and nightly; promote to a required check once it
    # has been green for ~10 consecutive runs (see ROADMAP S4-4).
    name: smoke (panel + agent e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: akari-panel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akari-projectX/akari-agent
          ref: ${{ inputs.agent_ref || 'main' }}
          path: akari-agent
          # smoke builds a pinned protocol-0 agent (2b3e7e3) from history.
          fetch-depth: 0
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
        working-directory: akari-panel
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: akari-panel
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: akari-agent/go.mod
          cache-dependency-path: akari-agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: akari-panel/spa/package-lock.json
      # The runner's own Postgres/Valkey would collide with compose's ports.
      - run: sudo systemctl stop postgresql || true
      # R22: the panel dials its main domain (install-link pin probe).
      - run: echo '127.0.0.1 myapp.test' | sudo tee -a /etc/hosts
      # Sections needing an agent feature the agent ref lacks are skipped
      # loudly (log line, warning annotation, job summary) on PR/push/
      # nightly runs; a dispatch (agent_ref) run fails on any skip.
      - run: make smoke AGENT_DIR=../akari-agent
        working-directory: akari-panel
        env:
          SMOKE_REQUIRE_AGENT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - if: failure()
        run: |
          tail -n 80 /tmp/akari-smoke/*.log || true
      - if: always()
        working-directory: akari-panel
        run: docker compose down -v || true

  coverage:
    # ROADMAP §0 "计费核心路径覆盖率 ≥ 90%": line coverage of the billing
    # core (traffic, enforce, entitle, plans, billing/*) over the whole
    # suite including the real-database tests; fails below the per-module
    # threshold (scripts/coverage-gate.py, docs/FUZZING.md).
    name: coverage (billing core >= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: akari
          POSTGRES_PASSWORD: akari-dev
          POSTGRES_DB: akari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akari" --health-interval 3s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov
      - run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked --version 0.9.1
      - run: cargo llvm-cov --locked --lcov --output-path target/cov.lcov
        env:
          AKARI_SKIP_DB_TESTS: ""
      - name: gate
        run: |
          set -o pipefail
          python3 scripts/coverage-gate.py target/cov.lcov | tee gate.txt
      - if: always()
        run: |
          { echo '### Billing-core line coverage'; echo; echo '```'; cat gate.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/cov.lcov
          retention-days: 14
