name: ci

# W37 tiered CI. Fast checks (rust, portal, admin, cargo-deny, release keys,
# shellcheck) run on every PR. Heavy jobs (coverage, bench tooling, smoke,
# e2e, docker, installer) run only when the `changes` job finds a path they
# cover (scripts/ci-changes.sh); otherwise they are skipped by their
# job-level `if:`, which reports success, so the required checks never wait.
# Everything runs on pushes to main, nightly, on dispatch, from release.yml
# (workflow_call, before anything is published), and on PRs labelled
# `full-ci`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: advisories appear without code changes; smoke drift
  workflow_call:
    inputs:
      agent_ref:
        description: akari-agent ref for the smoke job
        type: string
        default: main
  workflow_dispatch:
    inputs:
      agent_ref:
        # Panel-first merge order (CLAUDE.md): a panel PR whose feature
        # needs an unmerged agent change is verified by dispatching this
        # workflow on the panel branch with the agent branch here. Dispatch
        # runs are strict: smoke fails instead of skipping any
        # agent-dependent section (SMOKE_REQUIRE_AGENT=1).
        description: akari-agent ref for the smoke job (dispatch runs forbid smoke skips)
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swatinem/rust-cache: each job restores its own key (job id + lockfile +
  # toolchain); only main runs save (push, nightly), PR runs reuse main's
  # caches without writing their own (save-if below).
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same values as docker-compose.yml (the local dev stack).
  DATABASE_URL: postgres://akari:akari-dev@localhost:5432/akari
  VALKEY_URL: redis://127.0.0.1:6379

jobs:
  changes:
    # Which heavy job groups this run needs (scripts/ci-changes.sh). A PR
    # checkout is GitHub's merge commit: its first parent is the base
    # branch head, so `HEAD^1 HEAD` is exactly what merging would change.
    # Fail-safe: when this job fails, the gated jobs run (their `if:` only
    # skips on an explicit "false").
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.c.outputs.rust }}
      smoke: ${{ steps.c.outputs.smoke }}
      e2e: ${{ steps.c.outputs.e2e }}
      installer: ${{ steps.c.outputs.installer }}
      docker: ${{ steps.c.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = true ]; then scripts/ci-changes.sh full; else scripts/ci-changes.sh HEAD^1 HEAD; fi

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: akari
          POSTGRES_PASSWORD: akari-dev
          POSTGRES_DB: akari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akari" --health-interval 3s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # DB tests must run, not skip: AKARI_SKIP_DB_TESTS is deliberately
      # unset, and an unreachable database makes them panic (not pass).
      - run: cargo test --locked
        env:
          AKARI_SKIP_DB_TESTS: ""

  bench-tooling:
    # The M2 benchmark/load crate (bench/, own lockfile) must keep building
    # against the panel library; running the benchmarks is bench.yml.
    name: bench tooling (fmt, clippy)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: bench -> ../target
      - run: make bench-lint

  portal:
    # The user portal (portal/, Svelte 5; W36-b, portal v2 since the
    # cutover): typecheck (svelte-check, warnings fail), oxlint, colour
    # literals only in src/styles/tokens.css, i18n (every Chinese string
    # translated, no unused entries), every user-visible server error code
    # (../src/error_codes.txt) has text, unit tests, build + dist checks
    # (CSP-safe index, assets/ only) + no console code in the bundle
    # (check-bundles). No size budget (user ruling 2026-10-07): sizes go to
    # the job summary; the yardstick is the e2e job's performance report.
    # The admin console is its own app.
    name: portal (svelte-check, lint, i18n, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # package.json engines: >=22.18
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:colors
      - run: npm run check:i18n
      - run: npm run check:errors
      - run: npm test
      - run: npm run build
      - run: node scripts/bundle-report.mjs dist/app --markdown "$RUNNER_TEMP/size.md" && cat "$RUNNER_TEMP/size.md" >>"$GITHUB_STEP_SUMMARY"

  admin:
    # W33-b: the admin app (admin/: sign-in page + console), built apart
    # from the portal. Every server error code has zh + en text; the bundle
    # guard proves the sign-in page and the portal carry no console code.
    name: admin (tsc, lint, error codes, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # package.json engines: >=22.18
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      # Report-only gzip sizes (scripts/bundle-report.mjs; also in the step summary).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-bundle-report
          path: admin/dist/bundle-report.json
          retention-days: 14

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # rust-version: the action's bundled cargo-deny needs no toolchain.

  release-keys:
    # W25: the panel compiles in the official release keys (early refusal of
    # wrong uploads); src/release-keys.txt must stay a byte-identical copy of
    # akari-agent's release-keys.txt (the agents' trust root) on its main.
    # Also deploy/systemd/'s copy of the agent units (UNIT_FILES of the
    # agent's Makefile; its `make check-units` compares the same files
    # against panel main): a panel edit must not turn the agent's main red.
    # A unit change merges panel first (agent Makefile): push the agent's
    # change on an akari-agent branch named like this PR's branch, and the
    # units are compared against that branch instead of main.
    # (Job name kept: it is a required check.)
    name: release keys match akari-agent main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: akari-panel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akari-projectX/akari-agent
          ref: main
          path: akari-agent
      - run: |
          cmp akari-panel/src/release-keys.txt akari-agent/release-keys.txt || {
            echo "::error file=src/release-keys.txt::differs from akari-agent main release-keys.txt; copy it verbatim"
            diff akari-agent/release-keys.txt akari-panel/src/release-keys.txt
            exit 1
          }
      - id: units-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=main
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads \
            https://github.com/akari-projectX/akari-agent "refs/heads/$HEAD_REF" >/dev/null; then
            ref="$HEAD_REF"
          fi
          echo "agent units: akari-agent $ref"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akari-projectX/akari-agent
          ref: ${{ steps.units-ref.outputs.ref }}
          path: akari-agent-units
      - name: agent units match akari-agent main (or the paired branch)
        working-directory: akari-agent-units
        env:
          REF: ${{ steps.units-ref.outputs.ref }}
        run: |
          units="$(sed -n 's/^UNIT_FILES *= *//p' Makefile)"
          [ -n "$units" ] || { echo "::error::no UNIT_FILES in the akari-agent Makefile"; exit 1; }
          rc=0
          for u in $units; do
            cmp "systemd/$u" "../akari-panel/deploy/systemd/$u" || {
              echo "::error file=deploy/systemd/$u::differs from akari-agent systemd/$u ($REF): copy it verbatim"
              diff "systemd/$u" "../akari-panel/deploy/systemd/$u" || true
              rc=1
            }
          done
          exit $rc

  docker:
    # The release Dockerfile must keep building (no push): static binary,
    # non-root distroless runtime, version stamped. The image is built once
    # per run by the `build` job (default `runtime` target, from source);
    # this job loads and checks it.
    name: docker build (no push)
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: dist
      - name: image properties
        run: |
          gunzip -c dist/runtime-image.tar.gz | docker load
          [ "$(docker image inspect akari-panel:ci --format '{{.Config.User}}')" = "65532" ]
          docker run --rm akari-panel:ci --version
          docker run --rm akari-panel:ci --version | grep -q "(${GITHUB_SHA::12})$"
          docker run --rm --entrypoint /akari akari-panel:ci config check >/dev/null
      - name: monitoring config (Prometheus rules + tests, Grafana dashboards)
        run: make monitoring-check

  e2e:
    # Browser end-to-end (Playwright, Chromium; desktop + phone) against a real
    # panel serving the embedded portal at / with its real CSP, behind a TLS
    # front (passkeys): every line of research/portal-gap.md, no CSP violations
    # (scripts/e2e-portal.sh, portal/e2e/), and the portal performance report
    # next to the React portal's last numbers (artifact portal-perf); then the
    # admin app (scripts/e2e.sh, admin/e2e/).
    # Required check; W37: runs when the portal, the admin app (or what
    # serves them) changes.
    name: e2e (playwright, real CSP)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            admin/package-lock.json
      # The runner's own Postgres would collide with compose's port.
      - run: sudo systemctl stop postgresql || true
      - run: cd portal && npm ci && npx playwright install --with-deps chromium
      # admin/ and portal/ pin their own Playwright versions; each needs its browser build.
      - run: cd admin && npm ci && npx playwright install chromium
      # E2E_PERF_OUT: the portal performance report (report only, see
      # scripts/e2e-portal.sh); its summary goes to the job summary below.
      - run: make e2e
        # Leave time for the uploads below when a run hangs.
        timeout-minutes: 60
        env:
          E2E_PERF_OUT: ${{ runner.temp }}/perf
      - if: always()
        run: cat "$RUNNER_TEMP/perf/summary.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # Portal screenshot set (portal/e2e/; desktop 1440 / mobile 390,
      # light / dark) for design review and PR evidence.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-screens
          path: portal/test-results/screens
          if-no-files-found: warn
          retention-days: 14
      # Portal performance (JSON per profile, bundle sizes, summary.md with
      # the React portal's last numbers from the same harness); report only.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-perf
          path: |
            ${{ runner.temp }}/perf/perf-*.json
            ${{ runner.temp }}/perf/size-*.json
            ${{ runner.temp }}/perf/summary.md
          if-no-files-found: warn
          retention-days: 30
      # Admin screenshot set (admin/e2e/zz-screens.spec.ts) for design review.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-screens
          path: admin/test-results/screens
          if-no-files-found: warn
          retention-days: 14
      # Admin timing results (admin/e2e/zz-perf.spec.ts, report-only; also in the step summary).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-perf
          path: |
            admin/test-results/perf.json
            admin/test-results/perf-timeline.json
          if-no-files-found: warn
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            portal/test-results
            admin/playwright-report
            admin/test-results/*/error-context.md
            /tmp/akari-e2e-portal/*.log
            /tmp/akari-e2e/*.log
          retention-days: 7
      - if: always()
        run: docker compose down -v || true

  smoke:
    # Cross-repo end-to-end (smoke.sh). Needs the sibling layout
    # ../akari-agent, so both repos are checked out under the workspace dir.
    # Required check; W37: runs when the backend, migrations or the
    # contract change (agent changes: akari-agent's own smoke job).
    name: smoke (panel + agent e2e)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.smoke != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: akari-panel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akari-projectX/akari-agent
          ref: ${{ inputs.agent_ref || 'main' }}
          path: akari-agent
          # smoke builds a pinned protocol-0 agent (2b3e7e3) from history.
          fetch-depth: 0
      # rust-toolchain.toml pins the compiler (same as the Dockerfile).
      - run: rustup toolchain install --profile minimal
        working-directory: akari-panel
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: akari-panel
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: akari-agent/go.mod
          cache-dependency-path: akari-agent/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            akari-panel/portal/package-lock.json
            akari-panel/admin/package-lock.json
      # The runner's own Postgres/Valkey would collide with compose's ports.
      - run: sudo systemctl stop postgresql || true
      # R22: the panel dials its main domain (install-link pin probe).
      - run: echo '127.0.0.1 myapp.test' | sudo tee -a /etc/hosts
      # Sections needing an agent feature the agent ref lacks are skipped
      # loudly (log line, warning annotation, job summary) on PR/push/
      # nightly runs; a dispatch (agent_ref) run fails on any skip.
      - run: make smoke AGENT_DIR=../akari-agent
        working-directory: akari-panel
        env:
          SMOKE_REQUIRE_AGENT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - if: failure()
        run: |
          tail -n 80 /tmp/akari-smoke/*.log || true
      - if: always()
        working-directory: akari-panel
        run: docker compose down -v || true

  coverage:
    # ROADMAP §0 "计费核心路径覆盖率 ≥ 90%": line coverage of the billing
    # core (traffic, enforce, entitle, plans, billing/*) over the whole
    # suite including the real-database tests; fails below the per-module
    # threshold (scripts/coverage-gate.py, docs/FUZZING.md).
    name: coverage (billing core >= 90%)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: akari
          POSTGRES_PASSWORD: akari-dev
          POSTGRES_DB: akari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akari" --health-interval 3s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: llvm-cov
      - run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked --version 0.9.1
      - run: cargo llvm-cov --locked --lcov --output-path target/cov.lcov
        env:
          AKARI_SKIP_DB_TESTS: ""
      - name: gate
        run: |
          set -o pipefail
          python3 scripts/coverage-gate.py target/cov.lcov | tee gate.txt
      - if: always()
        run: |
          { echo '### Billing-core line coverage'; echo; echo '```'; cat gate.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/cov.lcov
          retention-days: 14

  shellcheck:
    # Every shell script (Makefile `shellcheck`, also part of `make check`).
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version && make shellcheck
      # The installer's validators again under busybox sh + busybox grep
      # (regex dialects differ: a `\]` in a bracket works with ugrep only).
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh /src/scripts/installer-test/validators.sh

  image-cache:
    # Main runs only (push, nightly): refresh the BuildKit layer cache of
    # the Dockerfile up to the cargo-chef `deps` stage (toolchain image,
    # cargo-chef, compiled dependencies with the CI profile), which `build`
    # reads. Never the crate's own target/: only the dependency layer. Runs
    # beside `build` so writing the cache never delays the checks; when the
    # dependencies are unchanged every layer is already cached.
    name: image cache (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: deps
          platforms: linux/amd64
          build-args: |
            CARGO_PROFILE=ci
          cache-from: type=gha,scope=panel-image
          cache-to: type=gha,mode=max,scope=panel-image
          outputs: type=cacheonly
          provenance: false

  build:
    # One build of the static musl binary and the images per run, shared by
    # the docker check and the installer jobs (artifacts). Made like a
    # release (Dockerfile `artifact` -> `prebuilt`) but with the CI cargo
    # profile (Cargo.toml [profile.ci]; release.yml ships `release`),
    # versioned <Cargo version>-ci.<run> so that the installer sees an
    # upgrade from the latest published release. Dependencies come from the
    # Dockerfile's cargo-chef `deps` stage in the GitHub Actions cache
    # (BuildKit `type=gha`, read-only here; written by `image-cache`).
    name: build (static binary + images)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.installer != 'false' || needs.changes.outputs.docker != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    env:
      CACHE_FROM: type=gha,scope=panel-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          ver="${base%%-*}-ci.${GITHUB_RUN_NUMBER}"
          # Cargo.toml and the lockfile's entry for this crate (--locked).
          sed -i "0,/^version = \"$base\"/s//version = \"$ver\"/" Cargo.toml
          python3 - "$base" "$ver" <<'PY'
          import sys
          base, ver = sys.argv[1:]
          s = open("Cargo.lock").read()
          a = f'name = "akari-panel"\nversion = "{base}"'
          assert a in s
          open("Cargo.lock", "w").write(s.replace(a, f'name = "akari-panel"\nversion = "{ver}"'))
          PY
          echo "tag=v$ver" >>"$GITHUB_OUTPUT"
          echo "version=$ver" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: static binary (Dockerfile `artifact`, profile ci)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: artifact
          platforms: linux/amd64
          build-args: |
            CARGO_PROFILE=ci
            AKARI_GIT_SHA=${{ steps.v.outputs.sha }}
          cache-from: ${{ env.CACHE_FROM }}
          outputs: type=local,dest=out
          provenance: false
      - run: |
          mkdir -p dist image
          install -m 0755 out/akari dist/akari-linux-amd64
          dist/akari-linux-amd64 --version | grep -q "^akari ${{ steps.v.outputs.version }} (${{ steps.v.outputs.sha }})$"
      # Default `runtime` target (from source): the same builder stages as
      # above, so only the runtime layers are new.
      - name: image (default `runtime` target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            CARGO_PROFILE=ci
            AKARI_GIT_SHA=${{ steps.v.outputs.sha }}
          cache-from: ${{ env.CACHE_FROM }}
          load: true
          tags: akari-panel:ci
          provenance: false
      - name: image (`prebuilt` from that binary)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64
          load: true
          tags: akari-panel:${{ steps.v.outputs.version }}
          provenance: false
      - run: |
          docker save akari-panel:ci | gzip -1 >image/runtime-image.tar.gz
          docker save "akari-panel:${{ steps.v.outputs.version }}" | gzip -1 >dist/image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-build
          path: dist
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: image
          retention-days: 3
          if-no-files-found: error

  installer-bare:
    # scripts/installer-test/bare-e2e.sh in a fresh systemd container: the
    # latest published release (v0.3.x) installed by the PR's installer from
    # GitHub (keyless cosign) -> its upgrade to the PR build is refused
    # untouched (v0.4 baseline: fresh install only) -> purge -> fresh install
    # of the PR build (local release, signed with a throwaway cosign key) ->
    # a deliberately broken release rolls back ->
    # uninstall keeps data / reinstall -> age-encrypted backup -> purge ->
    # install --restore (host move).
    name: installer (bare, ${{ matrix.base }}, ${{ matrix.address }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.installer != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { base: "debian:13", address: domain }
          - { base: "ubuntu:24.04", address: ip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-build
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: local releases (PR build, broken) and the previous release
        id: rel
        env:
          NEW: ${{ needs.build.outputs.tag }}
        run: |
          scripts/installer-test/make-release.sh "$RUNNER_TEMP/rel" "$NEW" --binary dist/akari-linux-amd64 --latest
          scripts/installer-test/make-release.sh "$RUNNER_TEMP/rel" v9.9.9 --broken
          prev="$(curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/akari-panel-image.txt \
            | sed -n 's/.*:\([0-9][^@]*\)@sha256:.*/v\1/p')"
          echo "prev=$prev" >>"$GITHUB_OUTPUT"
          echo "previous release: $prev"
      - run: scripts/installer-test/bare-e2e.sh "${{ matrix.base }}" "$RUNNER_TEMP/rel" "${{ needs.build.outputs.tag }}" v9.9.9 "${{ steps.rel.outputs.prev }}"
        env:
          ADDRESS: ${{ matrix.address }}

  installer-host:
    # scripts/installer-test/host-e2e.sh on the runner itself (systemd,
    # Docker): Docker mode = the latest published release (ghcr image), its
    # upgrade to the PR build refused untouched (v0.4 baseline) -> purge ->
    # fresh install of the PR build (image in a local registry, by digest);
    # then bare metal with a real agent (../akari-agent) -> `akari-ctl
    # migrate --to docker` -> `--to bare`: same prefix, the agent reconnects
    # without re-enrolling, the subscription link keeps working.
    name: installer (host, docker + migration)
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.installer != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: akari-panel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akari-projectX/akari-agent
          ref: main
          path: akari-agent
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: akari-agent/go.mod
          cache-dependency-path: akari-agent/go.sum
      - run: make -C akari-agent build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-build
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The runner's own PostgreSQL (16, port 5432) stays installed: the
      # installer's PostgreSQL 18 cluster gets the next free port.
      - run: sudo systemctl stop postgresql || true
      - name: PR image into a local registry; local releases
        id: rel
        env:
          NEW: ${{ needs.build.outputs.tag }}
        run: |
          docker run -d --restart always --name registry -p 127.0.0.1:5000:5000 ghcr.io/distribution/distribution:3.0.0
          gunzip -c dist/image.tar.gz | docker load
          ref="localhost:5000/akari-panel:${NEW#v}"
          docker tag "akari-panel:${NEW#v}" "$ref"
          for _ in $(seq 20); do docker push -q "$ref" && break; sleep 1; done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | sed 's/.*@//')"
          case "$digest" in sha256:*) ;; *) echo "::error::no registry digest for $ref"; exit 1 ;; esac
          akari-panel/scripts/installer-test/make-release.sh "$RUNNER_TEMP/rel" "$NEW" \
            --binary dist/akari-linux-amd64 --image "$ref@$digest" --latest
          prev="$(curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/akari-panel-image.txt \
            | sed -n 's/.*:\([0-9][^@]*\)@sha256:.*/v\1/p')"
          echo "prev=$prev" >>"$GITHUB_OUTPUT"
      - run: sudo -E env "PATH=$PATH" akari-panel/scripts/installer-test/host-e2e.sh "$RUNNER_TEMP/rel" "${{ needs.build.outputs.tag }}" akari-agent/agent "${{ steps.rel.outputs.prev }}"
      - if: failure()
        run: |
          sudo tail -n 120 /var/log/akari-install.log || true
          sudo journalctl -u akari-panel -u caddy -u akari-valkey -n 80 --no-pager || true
