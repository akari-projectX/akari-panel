name: dependabot-automerge

# Minor/patch Dependabot PRs (incl. their security updates) are put into the
# merge queue (`--auto`) once; the queue then runs the full CI on top of the
# latest main. Majors are never touched. Needs repo settings "Allow
# auto-merge" and the merge queue.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: dependabot automerge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --rebase "$PR_URL"
